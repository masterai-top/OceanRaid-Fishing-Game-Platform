name: Backend scaffold CI

on:
  push:
    paths:
      - "server-python/**"
      - "server-cpp/**"
      - "admin/**"
      - "database/**"
      - "config.example/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "server-python/**"
      - "server-cpp/**"
      - "admin/**"
      - "database/**"
      - "config.example/**"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest
      - run: python -m unittest discover -s ../tests/integration -p "test_*.py"

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S server-cpp -B server-cpp/build
      - run: cmake --build server-cpp/build --parallel
      - run: ctest --test-dir server-cpp/build --output-on-failure

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
